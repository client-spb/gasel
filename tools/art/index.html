<script>
window.renderAsset = function (name) {
  const a = ART.byName[name]; const c = document.createElement('canvas'); c.width = a.w; c.height = a.h;
  const ctx = c.getContext('2d'); a.draw(ctx, a.w, a.h);
  return { data: c.toDataURL(a.fmt === 'jpg' ? 'image/jpeg' : 'image/png', a.q), meta: a.meta, w: a.w, h: a.h, fmt: a.fmt };
};
window.assetNames = () => ART.list.map(a => a.name);
